[package]
name = "streampay-contract"
version = "0.1.0"
edition = "2021"
description = "StreamPay: continuous, linear streaming payments (payroll, vesting, subscriptions) for the Stellar network, built on Soroban."
license = "Apache-2.0"
keywords = ["stellar", "soroban", "payments", "streaming", "smart-contract"]
categories = ["cryptography::cryptocurrencies"]

[lib]
# `cdylib` for the Wasm build; `rlib` so the fuzz crate (and downstream
# Rust consumers) can link the pure rate math natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk.workspace = true

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = "1.6"
serde_json = "1"
streampay-model = { version = "0.1.0", path = "../../model" }
